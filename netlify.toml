[build]
  publish = "public"

# Netlify serves the browser application while the existing Node/PostgreSQL
# service remains the API backend. Update this hostname if your Render service
# uses a different URL.
[[redirects]]
  from = "/api/*"
  to = "https://mr-russians-casino.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "https://mr-russians-casino.onrender.com/healthz"
  status = 200
  force = true

# Keep direct visits to the single-page casino UI working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
